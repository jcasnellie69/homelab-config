---
# D082226 | CHG-DOCKER-SCRYPTED-SPACE-20260822 | add Docker VM health check via Proxmox guest agent | JC | ct409+docker-vm-109
# D091426 | CHG-DOCKER-HC-REVIEW-FIX-20260914 | crash-proof metric parsing, exact-match asserts, artifact before asserts | JC | ct409+docker-vm-109
- name: Audit Docker VM health through the Proxmox guest agent
  hosts: alpha
  gather_facts: false
  vars:
    docker_vm_vmid: 109
    docker_vm_name: docker
    docker_health_artifact_dir: /srv/artifacts/hc
    docker_health_critical_root_pct: 90
    docker_health_warn_root_pct: 80
    docker_health_required_containers:
      - scrypted
      - portainer
      - otel-collector
    docker_health_fail_on_restarting_containers: true
    docker_vm_health_script: |
      set -u
      echo "D082226 | CHG-DOCKER-SCRYPTED-SPACE-20260822 | Docker VM health check output | JC | docker-vm-109"
      echo "HC_TIMESTAMP=$(date -u +%Y-%m-%dT%H%M%SZ)"
      echo "HC_HOSTNAME=$(hostname)"

      root_use_pct="$(df -P / | awk 'NR == 2 { gsub("%", "", $5); print $5 }')"
      root_avail_kb="$(df -Pk / | awk 'NR == 2 { print $4 }')"
      echo "HC_ROOT_USE_PCT=${root_use_pct}"
      echo "HC_ROOT_AVAIL_KB=${root_avail_kb}"

      restarting_count="$(docker ps --filter status=restarting -q | wc -l | tr -d ' ')"
      echo "HC_RESTARTING_CONTAINER_COUNT=${restarting_count}"

      for container in {{ docker_health_required_containers | join(' ') }}; do
        metric_name="$(printf '%s' "$container" | sed 's/[^A-Za-z0-9]/_/g')"
        if docker ps --filter "name=^/${container}$" --filter status=running -q | grep -q .; then
          echo "HC_CONTAINER_${metric_name}=running"
        else
          echo "HC_CONTAINER_${metric_name}=not_running"
        fi
      done

      if docker exec scrypted sh -lc "ps -eo args | grep -F '@scrypted/tapo' | grep -v grep >/dev/null" 2>/dev/null; then
        echo "HC_SCRYPTED_TAPO_PLUGIN=running"
      else
        echo "HC_SCRYPTED_TAPO_PLUGIN=not_running"
      fi

      if docker exec scrypted sh -lc "ps -eo args | grep -F 'scrypted-eufy-security' | grep -v grep >/dev/null" 2>/dev/null; then
        echo "HC_SCRYPTED_EUFY_PLUGIN=running"
      else
        echo "HC_SCRYPTED_EUFY_PLUGIN=not_running"
      fi

      if docker exec scrypted sh -lc "test -d /server/volume/plugins/scrypted-eufy-security/n-node-v127-linux-x64-20250101/node_modules/eufy-security-client" 2>/dev/null; then
        echo "HC_SCRYPTED_EUFY_DEPENDENCY=present"
      else
        echo "HC_SCRYPTED_EUFY_DEPENDENCY=missing"
      fi

      # Everything above is machine-parsed; everything below is free-form
      # diagnostic output that must never influence the pass/fail verdict.
      echo "HC_METRICS_END"

      echo
      echo "## df"
      df -hT / /var/lib/docker /root/.scrypted 2>/dev/null || df -hT /
      echo
      echo "## inode"
      df -i / /var/lib/docker /root/.scrypted 2>/dev/null || df -i /
      echo
      echo "## block devices"
      lsblk -o NAME,SIZE,TYPE,FSTYPE,FSUSE%,MOUNTPOINTS
      echo
      echo "## docker info"
      docker info
      echo
      echo "## docker system df"
      docker system df -v
      echo
      echo "## docker ps"
      docker ps -a --no-trunc --size
      echo
      echo "## docker container log sizes"
      find /var/lib/docker/containers -name "*-json.log" -printf "%s %p\n" 2>/dev/null | sort -n | tail -20
      echo
      echo "## scrypted plugins"
      docker exec scrypted sh -lc "df -h /server/volume; du -hd4 /server/volume/plugins 2>/dev/null | sort -h | tail -80; ps -eo pid,ppid,stat,pcpu,pmem,args | grep -E 'scrypted-main|scrypted-serve|PID' | grep -v grep" 2>&1 || true
      echo
      echo "## network"
      ip -brief addr
      ip route

  tasks:
    - name: Build timestamp for Docker health artifact
      ansible.builtin.set_fact:
        docker_health_timestamp: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H%M%SZ') }}"

    - name: Ensure local health artifact directory exists
      ansible.builtin.file:
        path: "{{ docker_health_artifact_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Verify QEMU guest agent is reachable for the Docker VM
      ansible.builtin.command:
        argv:
          - qm
          - agent
          - "{{ docker_vm_vmid | string }}"
          - ping
      changed_when: false

    - name: Run Docker VM health script through QEMU guest agent
      ansible.builtin.command:
        argv:
          - qm
          - guest
          - exec
          - "{{ docker_vm_vmid | string }}"
          - --
          - bash
          - -lc
          - "{{ docker_vm_health_script }}"
      register: docker_vm_health_raw
      changed_when: false

    - name: Parse QEMU guest-agent health response
      ansible.builtin.set_fact:
        docker_vm_health_qga: "{{ docker_vm_health_raw.stdout | from_json }}"

    - name: Extract Docker VM health text
      ansible.builtin.set_fact:
        docker_vm_health_text: "{{ docker_vm_health_qga['out-data'] | default('') }}"
        docker_vm_health_error_text: "{{ docker_vm_health_qga['err-data'] | default('') }}"

    # Only the block above the HC_METRICS_END sentinel is parsed, so a container
    # name, log line, or `docker ps` row in the free-form diagnostics can never
    # satisfy (or spoof) an assertion. regex_findall returns [] on no match, so
    # this task cannot fail on malformed output; presence is asserted below.
    # hc_sentinel is built from a YAML-quoted newline rather than a Jinja '\n'
    # literal: inside a folded (>-) scalar Ansible does not unescape '\n'.
    - name: Parse HC_* metrics into a dict
      vars:
        hc_newline: "\n"
        hc_sentinel: "{{ hc_newline }}HC_METRICS_END{{ hc_newline }}"
      ansible.builtin.set_fact:
        docker_vm_health_metrics: >-
          {{ dict((docker_vm_health_text.split(hc_sentinel, 1) | first)
             | regex_findall('(?m)^HC_([A-Za-z0-9_]+)=(.*)$')) }}
        docker_vm_health_metrics_complete: "{{ hc_sentinel in docker_vm_health_text }}"

    - name: Write local Docker VM health artifact
      ansible.builtin.copy:
        dest: "{{ docker_health_artifact_dir }}/{{ docker_health_timestamp }}-docker-vm-health-{{ docker_vm_name }}.txt"
        mode: "0644"
        content: |
          D082226 | CHG-DOCKER-SCRYPTED-SPACE-20260822 | Docker VM health artifact | JC | docker-vm-109
          Timestamp: {{ docker_health_timestamp }}
          VMID: {{ docker_vm_vmid }}
          Host: {{ inventory_hostname }}
          Metrics block complete: {{ docker_vm_health_metrics_complete }}
          Root usage percent: {{ docker_vm_health_metrics.ROOT_USE_PCT | default('UNPARSED') }}
          Restarting containers: {{ docker_vm_health_metrics.RESTARTING_CONTAINER_COUNT | default('UNPARSED') }}
          QGA exit code: {{ docker_vm_health_qga.exitcode | default('unknown') }}

          # STDOUT
          {{ docker_vm_health_text }}

          # STDERR
          {{ docker_vm_health_error_text }}
      delegate_to: localhost

    - name: Print artifact path
      ansible.builtin.debug:
        msg: "{{ docker_health_artifact_dir }}/{{ docker_health_timestamp }}-docker-vm-health-{{ docker_vm_name }}.txt"

    # Distinguish "the check could not run" from "the VM is unhealthy" so a
    # broken guest script is not reported as a full disk.
    - name: Assert the guest health script ran and emitted a complete metrics block
      ansible.builtin.assert:
        that:
          - docker_vm_health_qga.exitcode | int == 0
          - docker_vm_health_metrics_complete | bool
          - docker_vm_health_metrics.ROOT_USE_PCT | default('') is match('^[0-9]+$')
          - docker_vm_health_metrics.RESTARTING_CONTAINER_COUNT | default('') is match('^[0-9]+$')
        fail_msg: >-
          Docker VM health script did not complete or produced unparseable metrics
          (exit code {{ docker_vm_health_qga.exitcode | default('unknown') }},
          metrics block complete: {{ docker_vm_health_metrics_complete }},
          parsed keys: {{ docker_vm_health_metrics.keys() | list }}).
          This is a check failure, not a health verdict. Review STDERR in the
          generated /srv/artifacts/hc Docker health artifact.

    - name: Extract numeric health metrics
      ansible.builtin.set_fact:
        docker_root_use_pct: "{{ docker_vm_health_metrics.ROOT_USE_PCT | int }}"
        docker_restarting_container_count: "{{ docker_vm_health_metrics.RESTARTING_CONTAINER_COUNT | int }}"

    # Metric key mirrors the guest script's sed: non-alphanumerics become "_".
    - name: Assert each required container is running
      vars:
        docker_health_container_key: "CONTAINER_{{ item | regex_replace('[^A-Za-z0-9]', '_') }}"
      ansible.builtin.assert:
        that:
          - docker_vm_health_metrics[docker_health_container_key] | default('missing') == 'running'
        fail_msg: >-
          Required container {{ item }} is not running on Docker VM
          {{ docker_vm_vmid }} (reported state:
          {{ docker_vm_health_metrics[docker_health_container_key] | default('missing') }}).
        quiet: true
      loop: "{{ docker_health_required_containers }}"

    - name: Assert Docker VM health is acceptable
      ansible.builtin.assert:
        that:
          - docker_root_use_pct | int < docker_health_critical_root_pct | int
          - docker_vm_health_metrics.SCRYPTED_TAPO_PLUGIN | default('missing') == 'running'
          - docker_vm_health_metrics.SCRYPTED_EUFY_PLUGIN | default('missing') == 'running'
          - docker_vm_health_metrics.SCRYPTED_EUFY_DEPENDENCY | default('missing') == 'present'
          - not docker_health_fail_on_restarting_containers | bool or docker_restarting_container_count | int == 0
        fail_msg: >-
          Docker VM health check failed (root {{ docker_root_use_pct }}% used,
          restarting containers: {{ docker_restarting_container_count }},
          tapo: {{ docker_vm_health_metrics.SCRYPTED_TAPO_PLUGIN | default('missing') }},
          eufy: {{ docker_vm_health_metrics.SCRYPTED_EUFY_PLUGIN | default('missing') }},
          eufy dependency: {{ docker_vm_health_metrics.SCRYPTED_EUFY_DEPENDENCY | default('missing') }}).
          Review the generated /srv/artifacts/hc Docker health artifact.
        success_msg: "Docker VM health check passed. Review the generated /srv/artifacts/hc Docker health artifact for details."
