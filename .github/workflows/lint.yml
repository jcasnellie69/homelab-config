# D082726 | CHG-CI-LINT-001 | ignore archival session logs and disable MD060 in markdownlint | JC | github-actions
name: Lint Docs and Shell

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install markdownlint
        run: npm install -g markdownlint-cli
      - name: Run markdownlint
        run: markdownlint --disable MD060 --ignore "docs/session-logs/**" "docs/**/*.md"
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          if [ -d scripts ]; then
            shellcheck scripts/**/*.sh || true
          fi
