name: Repository Health Curator

on:
  push:
    branches:
      - 'repo-health/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  open-draft-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft curator PR when missing
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          existing=$(gh pr list \
            --repo "$REPOSITORY" \
            --head "$HEAD_BRANCH" \
            --state open \
            --json url \
            --jq '.[0].url // empty')
          if [[ -n "$existing" ]]; then
            echo "Draft PR already exists: $existing"
            exit 0
          fi
          body=$(cat <<EOF
          ## Repository health checkpoint

          This draft PR was created from a server-side recovery checkpoint.

          - Source branch: \`$HEAD_BRANCH\`
          - Source commit: \`$SOURCE_SHA\`
          - Base branch: \`$BASE_BRANCH\`

          Validation failures from the local collector are advisory unless the
          repository policy marks them as hard gates. Review commit contents,
          split mixed backlog when useful, verify secret handling, and let the
          configured cloud agents refine the branch before merge.
          EOF
          )
          gh pr create \
            --repo "$REPOSITORY" \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --draft \
            --title "chore(repo-health): curate server checkpoint" \
            --body "$body"
